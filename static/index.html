<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <title>Fish — Portfolio Intelligence</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .fish-brand { background: #00d4aa; }
    .position-card { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 12px; margin-bottom: 6px; }
    .position-card .ticker { font-weight: 700; font-size: 14px; }
    .position-card .name { color: var(--muted); font-size: 11px; }
    .position-card .value { font-size: 18px; font-weight: 700; color: var(--accent); }
    .position-card .gain { font-size: 12px; }
    .position-card .gain.positive { color: var(--accent); }
    .position-card .gain.negative { color: var(--danger); }
    .chat-msg { margin: 8px 0; padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; }
    .chat-user { background: var(--panel2); }
    .chat-ai { background: rgba(0, 212, 170, 0.08); border-left: 3px solid var(--accent); }
    .chat-input { width: 100%; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 12px; }
    .chat-input:focus { outline: none; border-color: var(--accent); }
    .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
    .metric-box { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 12px; text-align: center; }
    .metric-val { font-size: 22px; font-weight: 700; color: var(--accent); }
    .metric-lbl { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .btn { background: var(--accent); color: #0d1006; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand fish-brand" href="/">
        <span class="brand-mark">F</span>
        <span>Fish</span>
      </a>
      <div class="side-label">NAVIGATE</div>
      <nav class="feed-nav">
        <a href="/" class="active" id="nav-dashboard"><span class="nav-icon">📊</span>Dashboard</a>
        <a href="/chat" id="nav-chat"><span class="nav-icon">💬</span>AI Chat</a>
        <a href="/trading" id="nav-trading"><span class="nav-icon">📈</span>Paper Trading</a>
        <a href="/backtest" id="nav-backtest"><span class="nav-icon">🎮</span>Backtest</a>
        <a href="/compare" id="nav-compare"><span class="nav-icon">👥</span>Compare</a>
      </nav>
      <div class="side-spacer"></div>
      <div class="source-mini">
        <div class="side-label">PORTFOLIO</div>
        <div id="portfolioMini"></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <div class="eyebrow">PORTFOLIO INTELLIGENCE</div>
          <h1 id="pageTitle">Chris Prior</h1>
          <p id="pageDescription">Personal portfolio dashboard with AI-powered analysis.</p>
        </div>
        <div class="top-actions">
          <button class="primary" onclick="refreshData()">Refresh</button>
        </div>
      </header>

      <div class="hero-card" id="heroCard">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="color:var(--muted);font-size:10px">PORTFOLIO VALUE</div>
            <h2 id="heroValue" style="margin:0">£183,826</h2>
          </div>
          <div style="text-align:right">
            <div style="color:var(--muted);font-size:10px">UNREALISED P/L</div>
            <h2 id="heroGain" class="positive" style="margin:0">+£13,082</h2>
          </div>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px">
          <span class="pill" id="heroReturn">+7.66%</span>
          <span class="pill">19 positions</span>
          <span class="pill">Dealing + ISA</span>
        </div>
      </div>

      <div class="section-head"><h2>Positions</h2></div>
      <div id="positionsList"></div>

      <div class="section-head"><h2>Daily Brief</h2></div>
      <div class="hero-card">
        <pre id="briefContent" style="font-size:11px;line-height:1.5;white-space:pre-wrap;color:var(--soft)"></pre>
      </div>
    </main>
  </div>

  <script>
    const API = '';
    async function api(path, opts={}) {
      const r = await fetch(API+path, {headers:{'Content-Type':'application/json'},...opts});
      return r.json();
    }
    function esc(s='') { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

    async function refreshData() {
      // Load portfolio
      const stocks = await api('/api/stocks');
      const list = document.getElementById('positionsList');
      let totalValue = 0, totalGain = 0;
      let html = '';
      stocks.forEach(p => {
        const n = JSON.parse(p.notes||'{}');
        const v = n.value||0, g = n.gain||0, pct = n.pct||0;
        totalValue += v; totalGain += g;
        const cls = g >= 0 ? 'positive' : 'negative';
        html += `<div class="position-card">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div><div class="ticker">${esc(p.ticker)}</div><div class="name">${esc(p.name)}</div></div>
            <div class="value">£${v.toLocaleString()}</div>
          </div>
          <div class="gain ${cls}">${g>=0?'+':''}£${g.toLocaleString()} (${pct>=0?'+':''}${pct.toFixed(2)}%)</div>
        </div>`;
      });
      list.innerHTML = html;

      // Update hero
      document.getElementById('heroValue').textContent = '£' + totalValue.toLocaleString();
      const gainEl = document.getElementById('heroGain');
      gainEl.textContent = (totalGain>=0?'+':'') + '£' + totalGain.toLocaleString();
      gainEl.className = totalGain >= 0 ? 'positive' : 'negative';
      const ret = (totalGain / (totalValue - totalGain) * 100).toFixed(2);
      document.getElementById('heroReturn').textContent = (ret>=0?'+':'') + ret + '%';

      // Load brief
      const brief = await api('/api/portfolio/brief');
      document.getElementById('briefContent').textContent = brief.brief;
    }

    // Load on page
    refreshData();
  </script>
</body>
</html>
